name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          # Install dependencies for mypy type checking if needed
          pip install -r requirements.txt

      - name: Run Ruff (Backend)
        run: ruff check .

      - name: Run Mypy (Backend)
        run: mypy src/ --ignore-missing-imports

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint (Frontend)
        working-directory: ./frontend
        run: npx eslint .

      - name: Run TypeScript Compiler (Frontend)
        working-directory: ./frontend
        run: npx tsc --noEmit

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: super_secure_password
          POSTGRES_DB: prediction_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5.12.0
        env:
          NEO4J_AUTH: neo4j/secure_password_here
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
        ports:
          - 7474:7474
          - 7687:7687
        # Note: Health checks for neo4j in GitHub Actions might need a delay as it takes time to start.
        # But for simplicity, we keep the default options.

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super_secure_password
      POSTGRES_DB: prediction_engine
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: secure_password_here
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Wait for services
        run: |
          # Give services an extra moment to fully initialize
          sleep 15

      - name: Create app_user role for RLS policies
        run: |
          PGPASSWORD=super_secure_password psql -h localhost -U postgres -d prediction_engine -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'app_user') THEN
                CREATE ROLE app_user WITH LOGIN PASSWORD 'secure_password_here';
              END IF;
            END
            \$\$;
            GRANT USAGE ON SCHEMA public TO app_user;
          "

      - name: Run Alembic migrations
        run: |
          alembic upgrade head

      - name: Run Pytest
        run: |
          pytest tests/

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: prediction-engine-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
