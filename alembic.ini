# Alembic Configuration File
# -----------------------------------------------------------
# This file is read by Alembic on every invocation.
# The actual database URL is injected at runtime from the
# DATABASE_URL environment variable (see env.py).
# -----------------------------------------------------------

[alembic]
# Path to the migration scripts directory
script_location = src/api/alembic

# Template used to generate new migration filenames
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
file_template = %%(rev)s_%%(slug)s

# Timezone to use for rendering "create_date" in migration scripts
# timezone =

# Max length of characters for the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during alembic's --hierarchical-revision
# prepend_sys_path = .
prepend_sys_path = .

# Version path separator; use "os" for os.pathsep
version_path_separator = os

# Placeholder — overridden by env.py from DATABASE_URL env var
sqlalchemy.url = postgresql://app_user:secure_password_here@localhost:5432/postgres


[post_write_hooks]
# Uncomment to run black on generated migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q


# ── Logging Configuration ───────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
