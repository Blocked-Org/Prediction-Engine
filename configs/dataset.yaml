# Default config (same as dataset.example.yaml). Tune for your CSV.

raw_glob: "data/raw/*.csv"
target_column: "Approved_Conversion"

drop_columns:
  - "ad_id"
  - "fb_campaign_id"
  - "xyz_campaign_id"

numeric_features:
  - "Impressions"
  - "Clicks"
  - "Spent"
  - "Total_Conversion"

categorical_features:
  - "age"
  - "gender"
  - "interest"

val_size: 0.15
test_size: 0.15
random_state: 42

scale_numeric: true

outlier:
  enabled: true
  iqr_multiplier: 1.5
  iqr_clip_columns:
    - "Impressions"
    - "Clicks"
    - "Spent"

processed_dir: "data/processed"
manifest_filename: "preprocessing_manifest.json"
train_filename: "train.parquet"
val_filename: "val.parquet"
test_filename: "test.parquet"

model_output_path: "models/xgb_pipeline.joblib"
