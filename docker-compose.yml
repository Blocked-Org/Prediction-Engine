version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: prediction_engine_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super_secure_password
      POSTGRES_DB: prediction_engine
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5.12.0
    container_name: prediction_engine_neo4j
    environment:
      NEO4J_AUTH: neo4j/secure_password_here
      # Enable APOC plugin for advanced graph algorithms
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474" # HTTP Dashboard
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: prediction_engine_redis
    ports:
      - "6379:6379"
    restart: unless-stopped


volumes:
  pg_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
